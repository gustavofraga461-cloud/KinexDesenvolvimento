name: Build Android APK - Kinex Desenvolvimento

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        run: npm install

      - name: Build da aplicação Web
        run: npm run build

      - name: Adicionar plataforma Android (Capacitor) e sincronizar
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: Kinex-Desenvolvimento-Pizzaria-Demo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
